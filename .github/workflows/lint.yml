name: Linting

on: [push, pull_request]

env:
  CI: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: yarn --frozen-lockfile
      - run: yarn clean
      - run: yarn prepack
      - run: yarn lint
      - run: yarn lint:deps
